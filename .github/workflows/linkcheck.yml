name: Link check
on:
  schedule:
    - cron: "17 7 3 * *"   # 3rd of each month, about 3 am Eastern, before the monthly update on the 5th
  workflow_dispatch:
  push:
    paths:
      - "guidelines.json"
      - "resources.json"
      - "patient-education.json"
permissions:
  contents: write
concurrency:
  group: linkcheck
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/check_links.py
      - name: Save results
        run: |
          git config user.name "link-check"
          git config user.email "link-check@users.noreply.github.com"
          git add linkcheck.json
          git diff --cached --quiet || (git commit -m "Link check $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
