name: Recent papers
on:
  schedule:
    - cron: "41 10 * * *"   # daily, about 6:41 am Eastern
  workflow_dispatch:
  push:
    paths:
      - "tools/fetch_papers.py"
permissions:
  contents: write
concurrency:
  group: papers
  cancel-in-progress: false
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 tools/fetch_papers.py
      - name: Save results
        run: |
          git config user.name "papers-feed"
          git config user.email "papers-feed@users.noreply.github.com"
          git add papers.json
          git diff --cached --quiet || (git commit -m "Recent papers $(date -u +%Y-%m-%d)" && git pull --rebase && git push)
